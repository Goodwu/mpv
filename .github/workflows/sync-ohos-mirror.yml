name: sync-ohos-mirror

on:
  schedule:
    - cron: '23 3 * * 0'  # weekly Sunday 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward mirror/feat-ohos-0.41.0
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream and push mirror (fast-forward only)
        run: |
          set -euo pipefail
          git init -q m && cd m
          git remote add upstream https://github.com/ErBWs/mpv.git
          ok=0
          for i in 1 2 3; do
            if timeout 900 git fetch --no-tags upstream feat-ohos-0.41.0; then ok=1; break; fi
            echo "fetch retry $i"; sleep 30
          done
          [ "$ok" = 1 ]
          tip=$(git rev-parse FETCH_HEAD)
          echo "upstream tip: $tip"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$tip":refs/heads/mirror/feat-ohos-0.41.0
